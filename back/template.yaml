Transform: AWS::Serverless-2016-10-31

# Los valores sensibles llegan como parámetros desde deploy.sh (leídos del .env),
# así no quedan escritos en este archivo. NoEcho evita que se muestren en CloudFormation.
Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "Connection string de PostgreSQL"
  JwtSecretKey:
    Type: String
    NoEcho: true
    Description: "Secret key para firmar los JWT"
  JwtAlgorithm:
    Type: String
    Default: HS256
  JwtAccessTokenExpireMinutes:
    Type: Number
    Default: 10080
  Debug:
    Type: String
    Default: 'False'
    AllowedValues: ['True', 'False']

Globals:
  Function:
    Timeout: 600
    MemorySize: 512
    Runtime: python3.14
    Environment:
      Variables:
        TZ: "America/Bogota"

Resources:
  MvpBaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'mvp-base-backend'
      Handler: lambda_handler.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          DEBUG: !Ref Debug
          JWT_SECRET_KEY: !Ref JwtSecretKey
          JWT_ALGORITHM: !Ref JwtAlgorithm
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: !Ref JwtAccessTokenExpireMinutes

      Events:
        Api:
          Type: HttpApi

Outputs:
  MvpBaseApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  MvpBaseFunction:
    Description: "MVP Base Lambda Function ARN"
    Value: !GetAtt MvpBaseFunction.Arn
